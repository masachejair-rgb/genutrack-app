<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenuTrack - Plataforma Universal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icono-192.png">

    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --secondary: #64748b;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --dark: #0f172a; --light: #f8fafc; --border: #e2e8f0; --surface: #ffffff;
        }

        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: var(--dark); margin: 0; padding: 2vh 2vw; height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* INICIO */
        .home-container { background-color: var(--surface); padding: 50px 60px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 800px; }
        .brand-title { font-size: 2.5rem; font-weight: 800; margin: 0 0 10px 0; }
        .brand-title span { color: var(--primary); }
        .mode-cards { display: flex; gap: 24px; justify-content: center; margin-top: 20px;}
        .mode-card { background-color: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px 24px; width: 280px; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: bold; font-size: 1.2rem;}
        .mode-card:hover { border-color: var(--primary); transform: translateY(-2px); color: var(--primary);}

        /* DASHBOARD */
        .dashboard { background-color: var(--surface); border-radius: 16px; width: 100%; max-width: 1200px; height: 94vh; display: grid; grid-template-columns: 350px 1fr; border: 1px solid var(--border); overflow: hidden;}
        .sidebar { background-color: #f8fafc; border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; overflow-y: auto; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .dash-header h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
        .header-right-group { display: flex; align-items: center; gap: 12px; }
        
        .battery-container { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--secondary); opacity: 0.4; transition: opacity 0.3s; }
        .battery-container.connected { opacity: 1; }
        .battery-icon { width: 22px; height: 11px; border: 2px solid var(--secondary); border-radius: 3px; position: relative; padding: 1px; }
        .battery-icon::after { content: ''; position: absolute; right: -4px; top: 2px; width: 2px; height: 7px; background-color: var(--secondary); border-radius: 0 2px 2px 0; }
        .battery-level { height: 100%; background-color: var(--success); width: 0%; border-radius: 1px; transition: width 0.3s; }

        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--secondary); font-weight: 700; margin-bottom: 8px; }
        .input-field { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit;}
        
        .axis-selector { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; background: white; padding: 12px; border-radius: 8px; border: 1px solid var(--border);}
        .axis-selector label { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;}
        
        .cronometro { background-color: var(--dark); color: var(--success); padding: 16px; border-radius: 8px; font-family: monospace; font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; display: flex; justify-content: center; gap: 8px; }
        .btn-connect { background-color: var(--dark); color: white; }
        .btn-start { background-color: var(--primary); color: white; display: none; }
        .btn-stop { background-color: var(--danger); color: white; display: none; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); }
        .btn-encerar { background-color: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; margin-bottom: 24px;}

        /* MAIN PANEL */
        .main-panel { padding: 32px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
        .top-stats { display: flex; gap: 12px; }
        .stat-card { flex: 1; background-color: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 16px 10px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }
        .center-visualization { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; }
        .angle-live-card { border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; }
        .live-angle-text { font-size: 5rem; font-weight: 800; color: var(--primary); margin: auto 0;}
        
        /* SISTEMA DE BIOFEEDBACK DINÁMICO */
        .biofeedback-card { border: 1px solid var(--border); border-radius: 12px; display: flex; justify-content: center; align-items: center; background-color: #f8fafc; min-height: 250px; }
        .limb-container { position: relative; width: 150px; height: 200px; transition: all 0.3s;}
        
        .proximal-segment { background-color: #94a3b8; position: absolute; z-index: 2; transition: all 0.3s;}
        .distal-segment { background-color: #64748b; position: absolute; z-index: 1; transition: all 0.3s, transform 0.1s linear;}
        .joint { background-color: var(--primary); border: 3px solid white; border-radius: 50%; position: absolute; z-index: 4; transition: all 0.3s;}

        /* PLANO SAGITAL (Flexión/Extensión) - VISTA DE PERFIL */
        .sagital .proximal-segment { width: 30px; height: 90px; border-radius: 15px; left: 60px; top: 10px; }
        .sagital .distal-segment { width: 24px; height: 100px; border-radius: 12px; left: 63px; top: 90px; transform-origin: 12px 12px; }
        .sagital .joint { width: 20px; height: 20px; left: 50%; bottom: -4px; transform: translateX(-50%); }

        /* PLANO FRONTAL (Abducción/Aducción) - VISTA DE FRENTE */
        .frontal .proximal-segment { width: 44px; height: 90px; border-radius: 10px; left: 53px; top: 10px; }
        .frontal .distal-segment { width: 36px; height: 100px; border-radius: 10px; left: 57px; top: 90px; transform-origin: 18px 12px; }
        .frontal .joint { width: 44px; height: 20px; border-radius: 10px; left: 50%; bottom: 0; transform: translateX(-50%); border-width: 2px;}

        /* PLANO TRANSVERSO (Rotación) - VISTA DESDE ARRIBA */
        .transverso .proximal-segment { width: 70px; height: 70px; border-radius: 50%; left: 40px; top: 65px; }
        .transverso .distal-segment { width: 8px; height: 90px; border-radius: 4px; left: 71px; top: 100px; transform-origin: 4px 0px; }
        .transverso .joint { width: 20px; height: 20px; left: 50%; bottom: 50%; transform: translate(-50%, 50%); }

        .graph-container { border: 1px solid var(--border); border-radius: 12px; padding: 16px; height: 180px; display: flex; flex-direction: column; }
        canvas { flex: 1; width: 100%; display: block; }

        @media (max-width: 768px) {
            body { padding: 0; height: 100%; overflow-y: auto; }
            .dashboard { grid-template-columns: 1fr; height: auto; border: none; }
            .sidebar { border-right: none; border-bottom: 2px solid var(--border); padding: 20px 16px; }
            .main-panel { padding: 20px 16px; gap: 16px; overflow-y: visible; }
            .top-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .center-visualization { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <div class="home-container">
            <h1 class="brand-title">Genu<span>Track</span> Clínico</h1>
            <p>Evaluación de la movilidad articular</p>
            <div class="mode-cards">
                <div class="mode-card" onclick="iniciarApp()">Ingresar a la Plataforma</div>
            </div>
        </div>
    </div>

    <div id="screen-dashboard" class="screen">
        <div class="dashboard">
            <div class="sidebar">
                <div class="dash-header">
                    <h2>GenuTrack</h2>
                    <div class="header-right-group">
                        <div class="battery-container" id="batContainer"><span id="batText">--%</span><div class="battery-icon"><div class="battery-level" id="batLevel"></div></div></div>
                    </div>
                </div>

                <div class="section-title">Articulación a Evaluar</div>
                <select id="selectArticulacion" class="input-field" onchange="actualizarVisualizacion()">
                    <option value="rodilla">Rodilla</option>
                    <option value="codo">Codo</option>
                    <option value="hombro">Hombro</option>
                    <option value="cuello">Columna Cervical</option>
                </select>

                <div class="section-title">Plano Osteocinemático</div>
                <div class="axis-selector">
                    <!-- SE INVIRTIERON Z Y X SEGÚN LA POSICIÓN FÍSICA DE TU SENSOR -->
                    <label><input type="radio" name="eje" value="Z" checked onchange="actualizarVisualizacion()"> Sagital (Flexión/Extensión)</label>
                    <label><input type="radio" name="eje" value="Y" onchange="actualizarVisualizacion()"> Frontal (Abducción/Aducción)</label>
                    <label><input type="radio" name="eje" value="X" onchange="actualizarVisualizacion()"> Transverso (Rotación)</label>
                </div>
                
                <button class="btn btn-encerar" id="btnEncerar" onclick="encerarAngulo()">🎯 Establecer Cero Anatómico (0°)</button>

                <div class="section-title">Control de Sesión</div>
                <div class="patient-form">
                    <input type="text" id="inNombre" class="input-field" placeholder="Nombre del paciente">
                </div>
                
                <div class="cronometro" id="tiempoPantalla">00:00.0</div>
                
                <div style="margin-top: auto;">
                    <button class="btn btn-connect" id="btnConectar" onclick="conectarBluetooth()">Vincular Sensor BLE</button>
                    <button class="btn btn-start" id="btnIniciar" onclick="iniciarTomaDatos()">Iniciar Grabación</button>
                    <button class="btn btn-stop" id="btnDetener" onclick="detenerTomaDatos()">Finalizar Grabación</button>
                    <button class="btn btn-outline" id="btnDescargar" onclick="descargarExcel()" style="display: none;">Exportar Reporte (.csv)</button>
                    <button class="btn btn-outline" id="btnRegresar" onclick="volverInicio()" style="margin-top:16px;">← Inicio</button>
                </div>
            </div>

            <div class="main-panel">
                <div class="top-stats">
                    <div class="stat-card"><div class="section-title">ROM Máximo</div><div class="stat-value" id="statMax">0°</div></div>
                    <div class="stat-card"><div class="section-title">ROM Mínimo</div><div class="stat-value" id="statMin">0°</div></div>
                    <div class="stat-card"><div class="section-title">Velocidad</div><div class="stat-value" id="statVelocidad">0°/s</div></div>
                </div>

                <div class="center-visualization">
                    <div class="angle-live-card">
                        <div class="section-title" id="tituloEjeTexto">Plano Sagital (Flexo-Extensión)</div>
                        <div class="live-angle-text" id="anguloPantalla">0<span>°</span></div>
                    </div>
                    
                    <div class="biofeedback-card">
                        <div class="limb-container sagital" id="contenedorPierna">
                            <div class="proximal-segment"><div class="joint"></div></div>
                            <div class="distal-segment" id="miembroAnimado"></div>
                        </div>
                    </div>
                </div>

                <div class="graph-container">
                    <div class="section-title">Cinemática en Vivo</div>
                    <canvas id="graficaAngulo"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let grabando = false; 
        let bluetoothDevice, rxCharacteristic, bleBuffer = "";
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let matrizClinica = []; 
        let tiempoInicio = 0, cronometroInterval;
        let historialGrafica = new Array(100).fill(0);
        const canvas = document.getElementById('graficaAngulo'), ctx = canvas.getContext('2d');

        let maxAngulo = 0, minAngulo = 999;
        let anguloAnteriorJS = 0, tiempoAnteriorJS = 0, velocidadSuavizada = 0;

        // Eje por defecto cambiado a Z (ahora Sagital)
        let ejeActivo = 'Z'; 
        let rawX = 0, rawY = 0, rawZ = 0;
        let offsetX = 0, offsetY = 0, offsetZ = 0;

        // --- VARIABLES DEL FILTRO DE RUIDO ---
        let anguloSuavizado = 0;
        let anguloMostrarFinal = 0;
        const ALPHA_FILTRO = 0.15; // Suavidad: 0.1 es muy suave, 0.9 es muy brusco
        const BANDA_MUERTA = 1;    // Ignorar cambios menores a 1 grado (ruido elástico)
        // -------------------------------------

        function iniciarApp() {
            document.getElementById('screen-home').classList.remove('active');
            document.getElementById('screen-dashboard').classList.add('active');
            dibujarGrafica();
        }

        function volverInicio() {
            if (grabando) return alert("Detén la toma de datos primero.");
            if(bluetoothDevice && bluetoothDevice.gatt.connected) bluetoothDevice.gatt.disconnect();
            document.getElementById('screen-dashboard').classList.remove('active');
            document.getElementById('screen-home').classList.add('active');
        }

        function actualizarVisualizacion() {
            ejeActivo = document.querySelector('input[name="eje"]:checked').value;
            let contenedor = document.getElementById('contenedorPierna');
            let titulo = document.getElementById('tituloEjeTexto');
            
            // Actualizado para reflejar tu orientación física
            if(ejeActivo === 'Z') {
                contenedor.className = "limb-container sagital";
                titulo.innerText = "Plano Sagital (Flexión/Extensión)";
            } else if(ejeActivo === 'Y') {
                contenedor.className = "limb-container frontal";
                titulo.innerText = "Plano Frontal (Abducción/Aducción)";
            } else if(ejeActivo === 'X') {
                contenedor.className = "limb-container transverso";
                titulo.innerText = "Plano Transverso (Rotación)";
            }
            
            document.getElementById('miembroAnimado').style.transform = "rotate(0deg)";
        }

        function encerarAngulo() {
            offsetX = rawX; offsetY = rawY; offsetZ = rawZ;
            anguloSuavizado = 0; // Reiniciamos también el filtro
            anguloMostrarFinal = 0;
            let btn = document.getElementById('btnEncerar');
            btn.innerHTML = "✅ Cero Anatómico Guardado";
            btn.style.backgroundColor = "var(--success)";
            btn.style.color = "white";
            setTimeout(() => {
                btn.innerHTML = "🎯 Establecer Cero Anatómico (0°)";
                btn.style.backgroundColor = "#eff6ff";
                btn.style.color = "var(--primary)";
            }, 2000);
        }

        async function conectarBluetooth() {
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'GenuTrack-BLE' }], optionalServices: [SERVICE_UUID]
                });
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnectBLE);
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(CHAR_TX_UUID);
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                document.getElementById('batContainer').classList.add('connected');
                document.getElementById('btnConectar').style.display = "none";
                document.getElementById('btnIniciar').style.display = "flex";
            } catch (error) { alert("Error de conexión."); }
        }

        function onDisconnectBLE() {
            if(grabando) detenerTomaDatos();
            document.getElementById('batContainer').classList.remove('connected');
            document.getElementById('btnIniciar').style.display = "none";
            document.getElementById('btnConectar').style.display = "flex";
        }

        function handleIncomingData(event) {
            bleBuffer += new TextDecoder().decode(event.target.value);
            let lines = bleBuffer.split('\n');
            for (let i = 0; i < lines.length - 1; i++) {
                let line = lines[i].trim();
                let match = line.match(/X:([\-\d\.]+)\s+Y:([\-\d\.]+)\s+Z:([\-\d\.]+)\s+B:(\d+)/);
                if(match) {
                    rawX = parseFloat(match[1]);
                    rawY = parseFloat(match[2]);
                    rawZ = parseFloat(match[3]);
                    
                    let bat = parseInt(match[4]);
                    document.getElementById('batText').innerText = bat + "%";
                    document.getElementById('batLevel').style.width = bat + "%";
                    document.getElementById('batLevel').style.backgroundColor = bat > 50 ? "var(--success)" : (bat > 20 ? "var(--warning)" : "var(--danger)");

                    let anguloBruto = 0;
                    if(ejeActivo === 'Z') anguloBruto = rawZ - offsetZ;
                    if(ejeActivo === 'Y') anguloBruto = rawY - offsetY;
                    if(ejeActivo === 'X') anguloBruto = rawX - offsetX;
                    
                    // --- APLICACIÓN DE LOS FILTROS MATEMÁTICOS ---
                    
                    // 1. Filtro EMA (Absorbe espasmos y temblores rápidos)
                    anguloSuavizado = (ALPHA_FILTRO * anguloBruto) + ((1 - ALPHA_FILTRO) * anguloSuavizado);
                    
                    // 2. Redondeo para eliminar números decimales (Convierte a Entero)
                    let anguloEntero = Math.round(anguloSuavizado);

                    // 3. Filtro de Banda Muerta (Ruido Elástico)
                    // Solo actualiza la pantalla si el movimiento supera el margen de ruido
                    if (Math.abs(anguloEntero - anguloMostrarFinal) >= BANDA_MUERTA) {
                        anguloMostrarFinal = anguloEntero;
                    }
                    
                    procesarDatoReal(anguloMostrarFinal);
                }
            }
            bleBuffer = lines[lines.length - 1]; 
        }

        function procesarDatoReal(angulo) {
            // Ya no usamos .toFixed(1) porque ahora es un número entero perfecto
            document.getElementById('anguloPantalla').innerHTML = `${Math.abs(angulo)}<span>°</span>`;
            
            // Animación CSS dinámica
            let giroAnimacion = (ejeActivo === 'Z') ? -angulo : angulo;
            document.getElementById('miembroAnimado').style.transform = `rotate(${giroAnimacion}deg)`;

            historialGrafica.shift();
            historialGrafica.push(Math.abs(angulo));
            dibujarGrafica();

            let tiempoAct = Date.now();
            if (tiempoAnteriorJS > 0 && (tiempoAct - tiempoAnteriorJS)/1000.0 > 0.02) {
                let vel = Math.abs((angulo - anguloAnteriorJS) / ((tiempoAct - tiempoAnteriorJS)/1000.0));
                velocidadSuavizada = (velocidadSuavizada * 0.8) + (vel * 0.2);
                document.getElementById('statVelocidad').innerText = Math.round(velocidadSuavizada) + "°/s";
            }
            anguloAnteriorJS = angulo; tiempoAnteriorJS = tiempoAct;

            if (grabando) {
                matrizClinica.push([(Date.now() - tiempoInicio)/1000, rawX - offsetX, rawY - offsetY, rawZ - offsetZ]);
                let angAbs = Math.abs(angulo);
                if (angAbs > maxAngulo) { maxAngulo = angAbs; document.getElementById('statMax').innerText = maxAngulo + "°"; }
                if (angAbs < minAngulo && (Date.now() - tiempoInicio) > 500) { minAngulo = angAbs; document.getElementById('statMin').innerText = minAngulo + "°"; }
            }
        }

        function iniciarTomaDatos() {
            if (document.getElementById('inNombre').value.trim() === "") return alert("Falta el nombre.");
            document.getElementById('btnIniciar').style.display = "none";
            document.getElementById('btnDetener').style.display = "flex";
            document.getElementById('btnDescargar').style.display = "none";
            
            matrizClinica = []; maxAngulo = 0; minAngulo = 999;
            tiempoInicio = Date.now(); grabando = true;
            cronometroInterval = setInterval(() => {
                let segs = Math.floor((Date.now() - tiempoInicio) / 1000);
                let decimas = Math.floor(((Date.now() - tiempoInicio) % 1000) / 100);
                document.getElementById('tiempoPantalla').innerText = Math.floor(segs/60).toString().padStart(2,'0') + ":" + (segs%60).toString().padStart(2,'0') + "." + decimas;
            }, 100); 
        }

        function detenerTomaDatos() {
            grabando = false; clearInterval(cronometroInterval);
            document.getElementById('btnDetener').style.display = "none";
            document.getElementById('btnIniciar').style.display = "flex";
            document.getElementById('btnDescargar').style.display = "flex";
        }

        function dibujarGrafica() {
            canvas.width = canvas.parentElement.clientWidth - 32;
            canvas.height = canvas.parentElement.clientHeight - 40;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
            for (let i = 0; i < 100; i++) {
                let x = (i / 99) * canvas.width;
                let y = canvas.height - ((historialGrafica[i] / 180) * canvas.height); 
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function descargarExcel() {
            let articulacion = document.getElementById('selectArticulacion').options[document.getElementById('selectArticulacion').selectedIndex].text;
            let csv = "REPORTE OSTEOCINEMATICO - GENUTRACK\nPaciente: " + document.getElementById('inNombre').value + "\nArticulacion: " + articulacion + "\n\n";
            // Ahora la leyenda indica que Z es el plano sagital y X el transverso
            csv += "Tiempo(s),Transversal_X(Grados),Frontal_Y(Grados),Sagital_Z(Grados)\n";
            // Exporta en números enteros, sin decimales
            matrizClinica.forEach(f => csv += f[0].toFixed(2) + "," + Math.round(f[1]) + "," + Math.round(f[2]) + "," + Math.round(f[3]) + "\n");
            
            let blob = new Blob([csv], { type: 'text/csv' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `GenuTrack_${document.getElementById('inNombre').value}.csv`;
            link.click();
        }
    </script>
</body>
</html>
